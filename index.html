<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBite | Smart Canteen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍲 CampusBite</h1>
        <p>Eat Smart, Reduce Waste</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Apply for Food</h2>
            <form id="orderForm">
                <label>Select Your Meal</label>
                <select id="mealType" required>
                    <option value="Standard Thali">Standard Thali</option>
                    <option value="Mini Meal">Mini Meal</option>
                    <option value="Snack Box">Snack Box</option>
                </select>

                <label>Pickup Time</label>
                <div class="time-group">
                    <input type="time" id="pickupTime" required>
                    <button type="button" class="btn-alt" onclick="extendTime()">+15 Mins</button>
                </div>

                <button type="submit" class="btn-main">Confirm Order</button>
            </form>
        </section>

        <section class="card donation-card">
            <h2>Donation Portal</h2>
            <p>Have extra food? Don't let it go to waste.</p>
            <button class="btn-donate" onclick="alert('Thank you! Our volunteer will contact you.')">Donate Surplus Food</button>
        </section>

        <section class="card admin-view">
            <h3>Canteen Insights (Staff Only)</h3>
            <div id="statusUpdate">Waiting for orders...</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
